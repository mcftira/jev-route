# pytest configuration for jev-route.
#
# Two rules drive this file:
#
# 1. **The suite is offline.** Every test must pass with no network route, no
#    TYPESAFE_API_KEY, and no GPU. ``conftest.py`` enforces that mechanically by
#    blocking outbound socket connections and by scrubbing the API key from the
#    environment, so a test that reaches for the cloud fails loudly instead of
#    quietly depending on somebody's laptop having a key. Tests that genuinely
#    need the network carry ``@pytest.mark.network`` and are skipped unless
#    ``RUN_NETWORK_TESTS=1``.
# 2. **Async is the default shape of the code under test.** ``asyncio_mode=auto``
#    means an ``async def test_*`` just works, which keeps the router and backend
#    tests readable instead of wrapping every call in ``asyncio.run``.

[pytest]
testpaths = tests
# The package is normally installed editable, but pinning src/ here means a bare
# `pytest` works on a fresh clone before `pip install -e .` has been run.
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-config
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    network: test performs real outbound network I/O; skipped unless RUN_NETWORK_TESTS=1
    slow: test takes more than a second; deselected with -m "not slow"
    integration: tests a framework integration (litellm, proxy, FastAPI)
    distill: tests the distillation pipeline
