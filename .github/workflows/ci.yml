# CI for jev-route.
#
# No secrets are referenced anywhere in this file, and none are needed. The
# whole system runs end-to-end on the deterministic MockBackend: routing,
# logging, distillation and the eval harness are all reproducible offline.
# Tests that would need TYPESAFE_API_KEY are marked `network` and are skipped
# here on purpose.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch/PR supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      # RUN_NETWORK_TESTS is deliberately NOT set: the `network` marker means
      # "requires real network access and credentials", and CI has neither.
      # `slow` is excluded to keep the matrix fast; both markers are declared in
      # pyproject.toml. The suite must pass fully offline -- no service
      # containers, because nothing in the core needs one.
      - name: Run tests
        run: python -m pytest -q -m "not network and not slow"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.6"

      # Run from the repo root so ruff picks up [tool.ruff] in pyproject.toml
      # (line-length 110, target py310, src = ["src", "tests"]).
      - name: ruff check
        run: ruff check .

      # `ruff format --check` is deliberately NOT enabled yet: the tree is not
      # ruff-format clean, so enforcing it here would only produce red Xes that
      # say nothing about correctness. Turn it on after a one-off `ruff format .`
      # lands in its own commit.

  dataset:
    name: eval dataset guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # evals/validate_dataset.py is stdlib only (argparse, json, re, sys,
      # collections, pathlib), so there is nothing to install. It re-derives
      # expected_tier from the labels, enforces enum values and coverage
      # minimums, and rejects real-looking PII. Exit 0 == the labelled dataset
      # is still honest; it prints a coverage table.
      - name: Validate labelled eval dataset
        run: python evals/validate_dataset.py

  # The reference deployment is a DGX Spark, which is arm64, so an arm64 signal
  # is genuinely useful. It is non-blocking: GitHub's arm64 hosted runners are
  # not available on every plan, and a red arm64 job must never be the reason a
  # merge to main is held up.
  arm64:
    name: test (arm64, non-blocking)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q -m "not network and not slow"
