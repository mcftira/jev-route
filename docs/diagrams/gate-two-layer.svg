<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="524px" preserveAspectRatio="none" style="width:1218px;height:524px;background:#FFFFFF;" version="1.1" viewBox="0 0 1218 524" width="1218px" zoomAndPan="magnify"><title>The two-layer local gate</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="177.1191" x="510.1904" y="23.5352">The two-layer local gate</text><!--entity R--><g id="elem_R"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="99.8096" x="663.5" y="49.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="79.8096" x="673.5" y="73.0234">raw excerpt</text></g><!--entity L1--><g id="elem_L1"><rect fill="#F1F1F1" height="95.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="401.2998" x="6" y="140.4883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="387.2998" y="145.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="385.2998" y="147.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="385.2998" y="151.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161" x="21" y="174.0234">Layer 1 &#8212; deterministic</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="242.1699" x="21" y="190.5117">22 detectors (15 hard + 7 advisory)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="361.2998" x="21" y="207">checksums: Luhn, IBAN mod-97, NHS mod-11, NINO</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.9551" x="21" y="223.4883">always runs &#183; never bypassed</text></g><!--entity L2--><g id="elem_L2"><rect fill="#F1F1F1" height="95.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="315.8096" x="882.5" y="140.4883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1178.3096" y="145.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1176.3096" y="147.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1176.3096" y="151.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="133.0615" x="897.5" y="174.0234">Layer 2 &#8212; semantic</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="253.6406" x="897.5" y="190.5117">sparse logistic regression, stdlib only</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="275.8096" x="897.5" y="207">shadow by default (scores, never blocks)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="228.8467" x="897.5" y="223.4883">enforce only on measured criteria</text></g><!--entity M--><g id="elem_M"><rect fill="#F1F1F1" height="79.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="262.9746" x="504" y="314.9883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="746.9746" y="319.9883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="744.9746" y="321.9883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="744.9746" y="325.9883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="96.585" x="519" y="348.5234">resolve_floor()</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="219.3037" x="519" y="365.0117">maximum over the layers' floors</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222.9746" x="519" y="381.5">&#8212; can only make routing stricter</text></g><!--entity V--><g id="elem_V"><rect fill="#F1F1F1" height="79.4648" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="234.4756" x="518.5" y="439.4883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="732.9756" y="444.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="730.9756" y="446.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="730.9756" y="450.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.1309" x="533.5" y="473.0234">final verdict</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="176.374" x="533.5" y="489.5117">sensitivity_floor &#183; pii_floor</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="194.4756" x="533.5" y="506">force_local &#183; blocks_backend</text></g><!--entity BL--><g id="elem_BL"><rect fill="#F1F1F1" height="95.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="303.8604" x="560.5" y="140.4883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="844.3604" y="145.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="842.3604" y="147.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="842.3604" y="151.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="241.3496" x="575.5" y="174.0234">gate-blocks.jsonl (separate stream)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="263.8604" x="575.5" y="190.5117">detector ids + features + excerpt hash</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="257.7559" x="575.5" y="207">never text &#8212; feeds rule improvement,</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.3467" x="575.5" y="223.4883">never model training</text></g><!--entity A--><g id="elem_A"><rect fill="#F1F1F1" height="95.9531" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="289.6416" x="895.5" y="306.4883"/><rect fill="#F1F1F1" height="10" style="stroke:#181818;stroke-width:0.5;" width="15" x="1165.1416" y="311.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1163.1416" y="313.4883"/><rect fill="#F1F1F1" height="2" style="stroke:#181818;stroke-width:0.5;" width="4" x="1163.1416" y="317.4883"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="146.4531" x="910.5" y="340.0234">semantic.json artifact</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="249.6416" x="910.5" y="356.5117">json.load-able, provenance-checked</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="189.1367" x="910.5" y="373">refuses to load if trained on</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.2725" x="910.5" y="389.4883">blocked content</text></g><g id="elem_GMN17"><path d="M38,333.9883 L38,374.6094 A0,0 0 0 0 38,374.6094 L375.418,374.6094 A0,0 0 0 0 375.418,374.6094 L375.418,343.9883 L365.418,333.9883 L210.5,333.9883 L206.5,236.9239 L202.5,333.9883 L38,333.9883 A0,0 0 0 0 38,333.9883 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M365.418,333.9883 L365.418,343.9883 L375.418,343.9883 L365.418,333.9883 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.3633" x="44" y="351.5566">Advisory detectors never set a floor.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316.418" x="44" y="366.8672">The detector list can be silenced; the scan cannot.</text></g><polygon fill="#181818" points="406.8016,140.4747,416.4775,142.3123,411.6693,139.3322,414.6495,134.524,406.8016,140.4747" style="stroke:#181818;stroke-width:1.0;"/><path d="M663.4994,80.2241 C603.7921,94.2383 506.0886,117.1706 412.6429,139.1037 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.9824" x="565.5" y="118.0566">every request</text><polygon fill="#181818" points="911.1325,140.4096,904.0431,133.573,906.434,138.6997,901.3073,141.0907,911.1325,140.4096" style="stroke:#181818;stroke-width:1.0;"/><path d="M760.3511,85.5381 C799.7326,99.8696 852.3154,119.0052 905.4943,138.3578 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.9824" x="858.5" y="118.0566">every request</text><polygon fill="#181818" points="534.7277,314.9646,527.7494,308.0146,530.0574,313.1792,524.8928,315.4872,534.7277,314.9646" style="stroke:#181818;stroke-width:1.0;"/><path d="M329.7215,236.5939 C394.7067,261.4368 467.8281,289.3899 529.1233,312.8221 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.6011" x="461.5" y="276.5566">layer-1 floors</text><polygon fill="#181818" points="730.6347,314.9646,740.478,315.2942,735.2691,313.088,737.4753,307.8791,730.6347,314.9646" style="stroke:#181818;stroke-width:1.0;"/><path d="M924.172,236.5939 C862.8223,261.4368 794.0621,289.2804 736.196,312.7126 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="86.6011" x="898.2786" y="269.0566">layer-2 floors</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.1582" x="875.5" y="284.3672">(only when enforced)</text><polygon fill="#181818" points="635.5,439.4807,639.5,430.4807,635.5,434.4807,631.5,430.4807,635.5,439.4807" style="stroke:#181818;stroke-width:1.0;"/><path d="M635.5,394.248 C635.5,408.6876 635.5,419.0638 635.5,433.4807 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="560.4462,188.4883,551.4462,184.4883,555.4462,188.4883,551.4462,192.4883,560.4462,188.4883" style="stroke:#181818;stroke-width:1.0;"/><path d="M407.2114,188.4883 C458.2569,188.4883 506.272,188.4883 554.4462,188.4883 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.4375" x="417.75" y="181.0566">on a blocking verdict</text><polygon fill="#181818" points="1040.5,236.9239,1036.5,245.9239,1040.5,241.9239,1044.5,245.9239,1040.5,236.9239" style="stroke:#181818;stroke-width:1.0;"/><path d="M1040.5,242.9239 C1040.5,264.7766 1040.5,284.638 1040.5,306.4427 " fill="none" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.2798" x="1042.5" y="276.5566">loaded + validated at start</text><!--SRC=[PLJ1QXin4BtlLqnpQKgz1XjAQ0e5vzI0aq9QSbe8uzNihcgjj9MqTdphH_HVUk-dz4lwfBM38GSRIJEQzsRUqxuPFBSza-636oE5NY9RBgAEHkXx9nJthaHGF1bNiw6MenI5bnfvBN8kFEz9dclnGxmW3lHGrAuVd1KRwMATRoxetw_Vf2IAxxNL8UgwiijbFgcZyu4k5n-eOw_eFLqHgvqEpX_ULRRkfDw6iG_Nj1uxEwFRczKzzKwL7wzcTF_bMrul5bZVtd-jB9iz7mBvqGRw-uUix02_EGmSWgXCRxrupM-P-GNfsMPgOM0V10stcIjvQRs4e1q8XAYCtf2pve34ZfNR0m2jD3oQI9UXTiYTdQ0nj6r08s8Rvsl9z_17lN0OlIYglSPOD4_abkVaKCUPdJmrnZb_YI8zF-j-xCcbqX7YP672MyePeRAfZPhjXDBpLiX3LMrRqFQw1b26kJj7QJIcHgYea82Mn0OTzKx7mmISvZXeFMsggOsdoGk8J0q-RRZUYfqc_7XUFTcbd9BcFm9uOKA2yU8uSHBkqTV91wHLW0CQuOZPfENHMF16w2